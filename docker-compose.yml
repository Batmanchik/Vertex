services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cheops-ai:latest
    container_name: cheops-api
    command: ["python", "-m", "uvicorn", "apris.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
      - ./.run:/app/.run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

